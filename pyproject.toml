[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miliken-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av==19.0.2",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "opencv-python==5.1.0.95",
    "pandas==3.1.1",
    "pyyaml==6.0.3",
    "scipy==1.18.1",
    "tqdm==4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
oiltrack = "src.cli:main"

[tool.setuptools]
packages = ["src"]
